<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kinnick Trivia Show Scoreboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Condensed:wght@400;700&display=swap"/>
<style>
body{
  margin:0;background:#03030a;
  font-family:'Roboto Condensed',sans-serif;
  color:#fff;
}

/* HEADER WITH SPOTLIGHT SWEEP */
.header{
  position:relative;
  text-align:center;
  padding:32px 12px;
  font-family:'Oswald';
  font-size:74px;
  font-weight:700;
  background:#0b0b18;
  border-bottom:4px solid #b00000;
  overflow:hidden;
}
.header::before{
  content:"";
  position:absolute;
  top:0;bottom:0;
  width:40%;
  background:radial-gradient(circle at top, rgba(255,255,255,0.18), transparent 70%);
  transform:skewX(-20deg);
  left:-10%;
}
.header::after{
  content:"";
  position:absolute;
  top:0;
  left:-40%;
  width:35%;
  height:100%;
  background:linear-gradient(115deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.18) 50%,
      rgba(255,255,255,0) 100%
  );
  animation:sweep 4.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes sweep{
  0%{left:-40%;}
  50%{left:110%;}
  100%{left:110%;}
}

.header .initial{
  font-size:96px;
  color:#fff;
}
.header-underline{
  width:260px;height:4px;background:#ff4444;margin:12px auto;border-radius:99px;
}

/* TRIVIA PANEL BACKGROUND */
.scoreboard-wrapper{
  width:60%;margin:40px auto;padding:26px;
  background:linear-gradient(135deg,#0e0e1c 0%, #050510 100%);
  border-radius:18px;
  box-shadow:0 0 42px rgba(0,0,0,0.8);
}

/* ROW BASE */
.row{
  position:relative;
  display:grid;
  grid-template-columns:46px 60px 3fr 1fr 1.6fr;
  padding:14px 16px;
  margin-bottom:10px;
  border-radius:14px;
  background:#11131c;
  box-shadow:
    0 8px 14px rgba(0,0,0,0.65),
    inset 0 2px 0 rgba(255,255,255,0.25),
    inset 0 -3px 5px rgba(0,0,0,0.9);
  border:1px solid #000;
  overflow:hidden;
  transition:0.2s;
}
.row::before{
  content:"";
  position:absolute;
  top:0;left:0;width:100%;height:45%;
  background:linear-gradient(to bottom, rgba(255,255,255,0.16), transparent);
  pointer-events:none;
}

/* MEDAL-COLORED BORDERS */
.top1{border-left:14px solid #d4a017;}
.top2{border-left:14px solid #c0c0c0;}
.top3{border-left:14px solid #cd7f32;}

.top1:hover{box-shadow:0 0 20px #d4a017,0 10px 18px rgba(0,0,0,0.85);}
.top2:hover{box-shadow:0 0 20px #c0c0c0,0 10px 18px rgba(0,0,0,0.85);}
.top3:hover{box-shadow:0 0 20px #cd7f32,0 10px 18px rgba(0,0,0,0.85);}
.row:not(.top1):not(.top2):not(.top3):hover{
  box-shadow:0 0 18px #b00000,0 10px 18px rgba(0,0,0,0.85);
}

/* SCORE FLASH */
.score.flash{
  animation:flashPulse 0.45s ease-out;
}
@keyframes flashPulse{
  0%{color:white;text-shadow:0 0 14px white;}
  60%{color:#ff4444;text-shadow:0 0 22px #ff4444;}
  100%{color:white;text-shadow:none;}
}

/* MEDAL ICONS */
.medal-icon{
  width:40px;height:40px;border-radius:50%;
  box-shadow:0 0 10px rgba(255,255,255,0.35);
}
.gold{background:radial-gradient(circle,#fff2a8,#d4a017);}
.silver{background:radial-gradient(circle,#ffffff,#bfbfbf);}
.bronze{background:radial-gradient(circle,#ffd19c,#cd7f32);}

/* TEXT */
.rank{font-size:32px;font-weight:700;text-align:center;text-shadow:0 0 4px #000;}
.name{
  background:transparent;border:none;color:white;
  font-size:27px;font-weight:600;padding-left:10px;
}
.score{
  font-size:38px;font-weight:700;text-align:center;
  text-shadow:0 0 4px #000;
}

/* BUTTONS */
.buttons{display:flex;justify-content:center;gap:14px;}
.buttons button{
  padding:8px 18px;font-size:22px;font-weight:700;
  background:#c00000;color:white;border:none;border-radius:6px;
  cursor:pointer;transition:0.15s;
}
.buttons button:hover{
  background:#e00000;transform:translateY(-2px);
  box-shadow:0 0 14px rgba(255,0,0,0.55);
}

.controls{
  display:flex;justify-content:center;gap:18px;margin:30px 0;
}
.controls button{
  padding:12px 26px;font-size:22px;background:#333;
  color:white;border:none;border-radius:6px;cursor:pointer;
}
</style>

<style>
.theme-btn{
  margin:0 6px;
  padding:10px 18px;
  font-size:18px;
  background:#222;
  color:#fff;
  border:none;
  border-radius:6px;
}
.theme-btn:hover{background:#444;}
/* Theme styles */
.header.classic{}
.header.neon{ text-shadow:0 0 12px #3cf, 0 0 22px #3cf; color:#aeeaff;}
.header.gold{ color:#ffd57a; text-shadow:0 0 12px #d4a017;}
.header.minimal{ color:#fff; text-shadow:none; background:#000 !important; border-bottom:2px solid #777;}
</style>
<script>
function setTheme(mode){
  const h=document.getElementById('header');
  h.classList.remove('classic','neon','gold','minimal');
  h.classList.add(mode);
}
</script>


<style>
/* Full scoreboard themes */
body.neon{
  background:#00111f !important;
  color:#b7eaff;
}
body.neon .header{background:#012a46 !important; text-shadow:0 0 18px #39c9ff;}
body.neon .row{background:#072235 !important;}
body.neon .theme-btn{background:#05405f !important;}

body.gold{
  background:#2b1a00 !important;
  color:#ffe9b8;
}
body.gold .header{background:#5a3a00 !important; text-shadow:0 0 18px #ffb400;}
body.gold .row{background:#3a2600 !important;}
body.gold .theme-btn{background:#7a5200 !important;}

body.minimal{
  background:#000 !important;
  color:#fff;
}
body.minimal .header{background:#000 !important; border-bottom:2px solid #666 !important;}
body.minimal .row{background:#111 !important; box-shadow:none !important;}
body.minimal .theme-btn{background:#333 !important;}
</style>

<script>
function setTheme(mode){
  const b=document.getElementById('app');
  b.classList.remove('classic','neon','gold','minimal');
  b.classList.add(mode);
}
</script>

</head>
<body id="app">

<div class="header">
  <span class="initial">K</span>INNICK
  <span class="initial">Q</span>UIZ
  <span class="initial">B</span>OWL
  <div class="header-underline"></div>
</div>



<div class="scoreboard-wrapper">
  <div id="table" class="left-table"></div>
</div>

<div class="controls">
  <button id="resetBtn">Reset Scores</button>
  <button id="screenshotBtn">Save Screenshot</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
let players=[...Array(12)].map((_,i)=>({id:i,name:'',score:0}));

function renderTable(){
  players.sort((a,b)=>b.score-a.score);
  const t=document.getElementById("table");
  t.innerHTML="";
  let ranks=[],last=null,rank=1;

  players.forEach((p,i)=>{
    if(p.score!==last){ranks[i]=rank;last=p.score;rank++;}
    else ranks[i]=ranks[i-1];
  });

  players.forEach((p,i)=>{
    const row=document.createElement("div");
    row.className="row";
    row.dataset.id=p.id;
    const rv=ranks[i];

    if(rv===1&&p.score>0)row.classList.add("top1");
    if(rv===2&&p.score>0)row.classList.add("top2");
    if(rv===3&&p.score>0)row.classList.add("top3");

    const icon=document.createElement("div");
    icon.className="medal-icon";
    if(rv===1&&p.score>0)icon.classList.add("gold");
    else if(rv===2&&p.score>0)icon.classList.add("silver");
    else if(rv===3&&p.score>0)icon.classList.add("bronze");
    else icon.style.visibility="hidden";
    row.appendChild(icon);

    const r=document.createElement("div");
    r.className="rank";
    r.textContent=rv;
    row.appendChild(r);

    const n=document.createElement("input");
    n.className="name";
    n.placeholder=`Player ${i+1}`;
    n.value=p.name;
    n.oninput=e=>p.name=e.target.value.trimEnd();
    n.onkeydown=e=>{
      const IN=document.querySelectorAll(".name");
      if((e.key==="Enter"||e.key==="ArrowDown")&&IN[i+1]){
        e.preventDefault();IN[i+1].focus();
      }
      if(e.key==="ArrowUp"&&IN[i-1]){
        e.preventDefault();IN[i-1].focus();
      }
    };
    row.appendChild(n);

    const s=document.createElement("div");
    s.className="score";
    s.textContent=p.score;
    row.appendChild(s);

    const b=document.createElement("div");
    b.className="buttons";

    const plus=document.createElement("button");
    plus.textContent="+1";
    plus.onclick=()=>{p.score++;flashScore(p.id);};

    const minus=document.createElement("button");
    minus.textContent="-1";
    minus.onclick=()=>{p.score--;flashScore(p.id);};

    b.appendChild(plus);
    b.appendChild(minus);
    row.appendChild(b);

    t.appendChild(row);
  });
}

function flashScore(id){
  renderTable();
  requestAnimationFrame(()=>{
    const el=document.querySelector(`.row[data-id='${id}'] .score`);
    if(!el)return;
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
  });
}

renderTable();

resetBtn.onclick=()=>{
  if(confirm("Reset all scores?")){
    players.forEach(p=>p.score=0);
    renderTable();
  }
};

screenshotBtn.onclick=()=>{
  html2canvas(document.body).then(c=>{
    const a=document.createElement("a");
    a.download="scoreboard.png";
    a.href=c.toDataURL();
    a.click();
  });
};
</script>

</body>
</html>
